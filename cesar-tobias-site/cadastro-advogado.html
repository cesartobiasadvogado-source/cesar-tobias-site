<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Vero Jurídico — Cadastro do Escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --surface-sunken: #efece4;
    --ink: #0f172a; --ink-soft: #475467; --ink-faint: #94a0b4; --line: #e2ded3;
    --brand: #16213e; --accent: #2c5ce0; --accent-soft: #e8edfc;
    --good: #079455; --good-soft: #e3f6ec;
    --warn: #ca8a04; --warn-soft: #fbf1da;
    --crit: #b42318; --crit-soft: #fbe7e5;
    --font-display: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  header.topo { text-align: center; margin-bottom: 32px; }
  header.topo h1 { font-family: var(--font-display); font-size: 26px; color: var(--brand); margin: 0 0 6px; }
  header.topo p { font-size: 14px; color: var(--ink-soft); margin: 0; }

  .passos { display: flex; gap: 6px; margin-bottom: 28px; }
  .passo-marca { flex: 1; height: 4px; border-radius: 3px; background: var(--line); }
  .passo-marca.feito { background: var(--good); }
  .passo-marca.atual { background: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  .card h2 { font-family: var(--font-display); font-size: 19px; color: var(--brand); margin: 0 0 6px; }
  .card .sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 22px; line-height: 1.5; }

  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin: 0 0 5px; }
  input, select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 15px; background: var(--bg); color: var(--ink); margin-bottom: 16px; font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .linha { display: flex; gap: 12px; }
  .linha > div { flex: 1; }

  button.principal {
    width: 100%; padding: 13px; border: none; border-radius: 9px; background: var(--accent);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button.principal:hover { opacity: 0.92; }
  button.principal:disabled { opacity: 0.55; cursor: not-allowed; }
  button.secundario {
    width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-sunken);
    color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 10px;
  }
  button.secundario:hover { background: var(--accent-soft); }

  .aviso { font-size: 13px; padding: 11px 13px; border-radius: 8px; margin-bottom: 16px; line-height: 1.5; }
  .aviso.erro { background: var(--crit-soft); color: var(--crit); }
  .aviso.ok { background: var(--good-soft); color: var(--good); }
  .aviso.espera { background: var(--warn-soft); color: var(--warn); }

  .status-linha { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 14px; }
  .bolinha { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
  .bolinha.ok { background: var(--good); }

  .codigo-escritorio {
    font-family: var(--font-mono); font-size: 20px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 8px; padding: 12px; text-align: center; margin: 14px 0 20px;
    letter-spacing: 0.04em;
  }
  .resumo-final { font-size: 14px; line-height: 1.9; }
  .resumo-final b { color: var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <header class="topo">
    <div style="font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px;">Vero Jurídico</div>
    <h1>Cadastro do Escritório</h1>
    <p>Configure sua conta na plataforma em poucos passos.</p>
  </header>

  <div class="passos" id="barra-passos"></div>

  <div class="card" id="card-conteudo"></div>
  <p id="link-novo-cadastro" style="display:none; text-align:center; margin-top:16px; cursor:pointer; text-decoration:underline; font-size:13.5px; color:var(--ink-soft);">Não é você? Começar um cadastro novo</p>
</div>

<script>
(function () {
  var API = '/api/painel';
  var TOTAL_PASSOS = 4;
  var estado = {
    passo: 1,
    tenant_id: localStorage.getItem('cadastro_tenant_id') || '',
    nome_advogado: '',
  };

  function salvarEstado() {
    if (estado.tenant_id) localStorage.setItem('cadastro_tenant_id', estado.tenant_id);
  }

  async function chamar(acao, corpo, metodo) {
    metodo = metodo || 'POST';
    var url = API + '?acao=' + acao;
    if (metodo === 'GET' && corpo) {
      Object.keys(corpo).forEach(function (k) { url += '&' + k + '=' + encodeURIComponent(corpo[k]); });
    }
    var resposta = await fetch(url, metodo === 'POST' ? {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo || {})
    } : undefined);
    var dados = await resposta.json().catch(function () { return {}; });
    return { ok: resposta.ok, dados: dados };
  }

  function renderBarraPassos() {
    var barra = document.getElementById('barra-passos');
    barra.innerHTML = '';
    for (var i = 1; i <= TOTAL_PASSOS; i++) {
      var marca = document.createElement('div');
      marca.className = 'passo-marca' + (i < estado.passo ? ' feito' : i === estado.passo ? ' atual' : '');
      barra.appendChild(marca);
    }
  }

  function render() {
    renderBarraPassos();
    var card = document.getElementById('card-conteudo');
    card.innerHTML = '';
    var passos = {
      1: renderPasso1Dados,
      2: renderPasso2Google,
      3: renderPasso5Login,
      4: renderPasso7Final,
    };
    passos[estado.passo](card);
    if (estado.passo > 1 && estado.passo < TOTAL_PASSOS) {
      var btnVoltar = document.createElement('button');
      btnVoltar.className = 'secundario';
      btnVoltar.textContent = '← Voltar';
      btnVoltar.style.marginTop = '10px';
      btnVoltar.onclick = voltar;
      card.appendChild(btnVoltar);
    }
  }

  function avancar() {
    estado.passo += 1;
    salvarEstado();
    render();
  }

  function voltar() {
    estado.passo -= 1;
    salvarEstado();
    render();
  }

  // --- Passo 1: dados do advogado ---
  function renderPasso1Dados(card) {
    var editando = !!estado.tenant_id;
    var d = estado.dadosPasso1 || {};
    card.innerHTML =
      '<h2>Seus dados</h2>' +
      '<p class="sub">Usamos o número da OAB como identificador único do seu cadastro. CPF, RG e cidade ' +
      'são usados pra preencher automaticamente os contratos e procurações gerados pela plataforma.</p>' +
      '<div id="erro-p1"></div>' +
      '<label>Nome completo</label>' +
      '<input id="in-nome" placeholder="Seu nome completo" value="' + (d.nome || '') + '">' +
      '<div class="linha">' +
      '<div><label>Número da OAB</label><input id="in-oab-num" placeholder="Ex: 12345" value="' + (d.oabNum || '') + '"' + (editando ? ' disabled' : '') + '></div>' +
      '<div><label>UF</label><input id="in-oab-uf" placeholder="Ex: SP" maxlength="2" style="text-transform:uppercase" value="' + (d.oabUf || '') + '"' + (editando ? ' disabled' : '') + '></div>' +
      '</div>' +
      '<div class="linha">' +
      '<div><label>CPF</label><input id="in-cpf" placeholder="000.000.000-00" value="' + (d.cpf || '') + '"></div>' +
      '<div><label>RG</label><input id="in-rg" placeholder="Número do RG" value="' + (d.rg || '') + '"></div>' +
      '</div>' +
      '<label>Cidade/UF do escritório</label>' +
      '<input id="in-cidade" placeholder="Ex: São Paulo/SP" value="' + (d.cidade || '') + '">' +
      '<label>Nome do escritório (opcional)</label>' +
      '<input id="in-escritorio" placeholder="Nome do seu escritório" value="' + (d.escritorio || '') + '">' +
      (editando ? '<p class="sub" style="margin:-4px 0 16px;">O número e a UF da OAB não podem ser alterados aqui, porque são o identificador do seu cadastro.</p>' : '') +
      '<button class="principal" id="btn-p1">' + (editando ? 'Salvar alterações' : 'Criar meu cadastro') + '</button>';

    document.getElementById('btn-p1').onclick = async function () {
      var btn = this;
      var nome = document.getElementById('in-nome').value.trim();
      var oabNum = document.getElementById('in-oab-num').value.trim();
      var oabUf = document.getElementById('in-oab-uf').value.trim();
      var cpf = document.getElementById('in-cpf').value.trim();
      var rg = document.getElementById('in-rg').value.trim();
      var cidade = document.getElementById('in-cidade').value.trim();
      var escritorio = document.getElementById('in-escritorio').value.trim();
      var erroDiv = document.getElementById('erro-p1');
      erroDiv.innerHTML = '';
      if (!nome || !oabNum || !oabUf) {
        erroDiv.innerHTML = '<div class="aviso erro">Preencha nome, número e UF da OAB.</div>';
        return;
      }
      estado.dadosPasso1 = { nome: nome, oabNum: oabNum, oabUf: oabUf, cpf: cpf, rg: rg, cidade: cidade, escritorio: escritorio };
      btn.disabled = true; btn.textContent = editando ? 'Salvando...' : 'Criando...';
      var r = editando
        ? await chamar('atualizar_tenant', {
            tenant_id: estado.tenant_id, nome_advogado: nome, nome_escritorio: escritorio,
            cpf: cpf, rg: rg, cidade_escritorio: cidade,
          })
        : await chamar('criar_tenant', {
            nome_advogado: nome, oab_numero: oabNum, oab_uf: oabUf, nome_escritorio: escritorio,
            cpf: cpf, rg: rg, cidade_escritorio: cidade,
          });
      btn.disabled = false; btn.textContent = editando ? 'Salvar alterações' : 'Criar meu cadastro';
      if (!r.ok || !r.dados.ok) {
        erroDiv.innerHTML = '<div class="aviso erro">' + (r.dados.erro || 'Não foi possível salvar.') + '</div>';
        return;
      }
      if (!editando) estado.tenant_id = r.dados.tenant_id;
      estado.nome_advogado = nome;
      salvarEstado();
      avancar();
    };
  }

  // --- Passo 2: Google ---
  function renderPasso2Google(card) {
    card.innerHTML =
      '<h2>Conectar com o Google</h2>' +
      '<p class="sub">Sua conta do Google (Drive, Gmail, Agenda) é onde ficam guardados os documentos e clientes. ' +
      'Vamos abrir a tela oficial do Google numa aba nova.</p>' +
      '<div class="status-linha"><span class="bolinha" id="bolinha-google"></span><span id="texto-google">Ainda não conectado</span></div>' +
      '<div id="erro-p2"></div>' +
      '<button class="principal" id="btn-conectar-google">Conectar com o Google</button>' +
      '<button class="secundario" id="btn-verificar-google">Já conectei, verificar</button>' +
      '<button class="secundario" id="btn-p2-pular">Pular por enquanto (conecto depois)</button>';

    document.getElementById('btn-p2-pular').onclick = function () { avancar(); };

    document.getElementById('btn-conectar-google').onclick = function () {
      window.open(
        'https://63quf5pqd4t5hgjuvi67r3juzq0mawnb.lambda-url.us-east-1.on.aws/?action=oauth_google_iniciar&tenant_id=' +
        encodeURIComponent(estado.tenant_id), '_blank'
      );
    };
    document.getElementById('btn-verificar-google').onclick = async function () {
      var btn = this;
      btn.disabled = true; btn.textContent = 'Verificando...';
      var r = await chamar('tenant_status', { tenant_id: estado.tenant_id }, 'GET');
      btn.disabled = false; btn.textContent = 'Já conectei, verificar';
      var erroDiv = document.getElementById('erro-p2');
      if (r.ok && r.dados.google_conectado) {
        document.getElementById('bolinha-google').classList.add('ok');
        document.getElementById('texto-google').textContent = 'Conectado!';
        erroDiv.innerHTML = '<div class="aviso ok">Google conectado com sucesso.</div>';
        setTimeout(avancar, 900);
      } else {
        erroDiv.innerHTML = '<div class="aviso espera">Ainda não detectei a conexão. Conclua a autorização na aba do Google e tente de novo.</div>';
      }
    };
  }

  // --- Passo 5: criar login ---
  function renderPasso5Login(card) {
    card.innerHTML =
      '<h2>Criar seu login</h2>' +
      '<p class="sub">Esse será o usuário e senha pra você entrar no painel.</p>' +
      '<div id="erro-p5"></div>' +
      '<label>Nome de usuário</label>' +
      '<input id="in-usuario" placeholder="Ex: seunome">' +
      '<label>Senha</label>' +
      '<input id="in-senha" type="password" placeholder="Escolha uma senha forte">' +
      '<button class="principal" id="btn-p5">Criar login e finalizar</button>';

    document.getElementById('btn-p5').onclick = async function () {
      var btn = this;
      var usuario = document.getElementById('in-usuario').value.trim();
      var senha = document.getElementById('in-senha').value;
      var erroDiv = document.getElementById('erro-p5');
      erroDiv.innerHTML = '';
      if (!usuario || !senha) {
        erroDiv.innerHTML = '<div class="aviso erro">Preencha usuário e senha.</div>';
        return;
      }
      btn.disabled = true; btn.textContent = 'Criando...';
      var r = await chamar('criar_usuario_tenant', {
        tenant_id: estado.tenant_id, nome: estado.nome_advogado || usuario, usuario: usuario, senha: senha
      });
      if (!r.ok || !r.dados.ok) {
        btn.disabled = false; btn.textContent = 'Criar login e finalizar';
        erroDiv.innerHTML = '<div class="aviso erro">' + (r.dados.erro || 'Não foi possível criar o login.') + '</div>';
        return;
      }
      // confirma que o login realmente funciona antes de dar como concluido
      var rLogin = await chamar('login_tenant', { tenant_id: estado.tenant_id, usuario: usuario, senha: senha });
      btn.disabled = false; btn.textContent = 'Criar login e finalizar';
      if (!rLogin.ok || !rLogin.dados.ok) {
        erroDiv.innerHTML = '<div class="aviso erro">Login criado, mas o teste de entrada falhou. Tente novamente.</div>';
        return;
      }
      estado.usuario = usuario;
      salvarEstado();
      avancar();
    };
  }

  // --- Passo 7: final ---
  function renderPasso7Final(card) {
    card.innerHTML =
      '<h2>Cadastro concluído!</h2>' +
      '<p class="sub">Guarde essas informações — você vai precisar delas pra entrar.</p>' +
      '<div class="codigo-escritorio">' + estado.tenant_id + '</div>' +
      '<div class="resumo-final">' +
      '<b>Código do escritório:</b> ' + estado.tenant_id + '<br>' +
      '<b>Usuário:</b> ' + (estado.usuario || '') + '<br>' +
      '</div>' +
      '<div class="aviso espera" style="margin-top:18px;">' +
      'Seu login já funciona de verdade e foi testado agora. Uma observação importante: ' +
      'as telas do painel (clientes, financeiro, contratos) ainda estão sendo adaptadas pra mostrar ' +
      'os dados de cada escritório separadamente — essa parte está em construção pela equipe.' +
      '</div>';
  }

  // Se ja tinha um cadastro em andamento neste navegador, comeca do passo 2
  if (estado.tenant_id) {
    estado.passo = 2;
    document.getElementById('link-novo-cadastro').style.display = 'block';
  }
  document.getElementById('link-novo-cadastro').onclick = function () {
    localStorage.removeItem('cadastro_tenant_id');
    estado.tenant_id = '';
    estado.nome_advogado = '';
    estado.usuario = '';
    estado.dadosPasso1 = null;
    estado.passo = 1;
    this.style.display = 'none';
    render();
  };
  render();
})();
</script>
</body>
</html>
